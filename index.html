function openSearch(){document.getElementById('searchPanel').classList.add('show');const inp=document.getElementById('searchInput');setTimeout(()=>inp.focus(),80)}function closeSearch(){document.getElementById('searchPanel').classList.remove('show');document.getElementById('searchInput').value='';document.getElementById('searchResult').className='search-empty';document.getElementById('searchResult').textContent='输入片名开始搜索'}
let timer=null;document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(()=>tmdbSearch(q),280)});document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=e.target.value.trim();if(q){closeSearch();openPan();document.getElementById('panStatus').textContent='正在搜索：'+q;document.getElementById('panResults').innerHTML='<div class="search-empty">正在聚合资源站…</div>';aggregateSearch(q).then(x=>renderSearchResults(x,q)).catch(()=>document.getElementById('panResults').innerHTML='<div class="search-empty">搜索失败</div>')}}});
async function tmdbSearch(q){const box=document.getElementById('searchResult');if(!q){box.className='search-empty';box.textContent='输入片名开始搜索';return}box.className='search-empty';box.textContent='搜索中…';try{const d=JSON.parse(await request(`${TMDB}/search/multi?api_key=${TMDB_KEY}&language=zh-CN&include_adult=false&query=${encodeURIComponent(q)}`,{timeout:8}));const list=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,12);box.className=list.length?'result-list':'search-empty';box.innerHTML=list.length?list.map(x=>`<div class="result"><img src="${x.poster_path?IMG342+x.poster_path:''}"><div><h3>${esc(x.title||x.name)}</h3><p>${(x.release_date||x.first_air_date||'').slice(0,4)} · ★ ${Number(x.vote_average||0).toFixed(1)}</p></div><button onclick="closeSearch();openItem(${JSON.stringify({id:x.id,media:x.media_type,title:x.title||x.name,pic:x.poster_path?IMG342+x.poster_path:'',score:String(x.vote_average||'')})})">›</button></div>`).join(''):'未找到内容'}catch(e){box.className='search-empty';box.textContent='搜索失败'}}
function openLibrary(){const arr=readLS(LS_HISTORY,[]);const fav=readLS(LS_FAV,[]);const overlay=document.getElementById('libraryOverlay');overlay.classList.add('show');overlay.innerHTML=`<div class="sheet"><button class="close" onclick="closeOverlay('libraryOverlay')" style="position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 16px);z-index:5">×</button><div style="padding-top:72px"><div class="eyebrow">YOUR LIBRARY</div><h1 class="detail-title">片库</h1><div class="library-tabs"><button class="active" onclick="renderLibraryPage('all',this)">最近</button><button onclick="renderLibraryPage('fav',this)">收藏 · ${fav.length}</button><button onclick="renderLibraryPage('history',this)">历史 · ${arr.length}</button></div><div id="libraryGrid" class="grid" style="margin-top:18px"></div><div id="libraryEmpty" class="search-empty">暂无内容</div></div></div>`;renderLibraryPage('history')}
function renderLibraryPage(type,btn){document.querySelectorAll('#libraryOverlay .library-tabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');let arr=type==='fav'?readLS(LS_FAV,[]):type==='history'?readLS(LS_HISTORY,[]):items;document.getElementById('libraryGrid').innerHTML=arr.map(card).join('');document.getElementById('libraryEmpty').style.display=arr.length?'none':'block'}
function openSources(){const box=document.getElementById('sources');box.innerHTML=sites.map(s=>`<button class="source" onclick="openBrowseForSite('${s.id}')"><b>${esc(s.name)}</b><span>${s.cats.slice(2,6).map(c=>c[1]).join(' · ')}</span></button>`).join('');document.getElementById('sourceModal').classList.add('show')}function closeSources(){document.getElementById('sourceModal').classList.remove('show')}
async function openBrowseForSite(s,q=''){if(typeof s==='string')s=sites.find(x=>x.id===s);if(!s)return;activeSiteId=s.id;document.getElementById('browseTitle').textContent=s.name;document.getElementById('browseModal').classList.add('show');const tabs=document.getElementById('browseTabs');tabs.innerHTML=s.cats.map(c=>`<button onclick="browseSiteCat('${s.id}','${safe(c[0])}')">${esc(c[1])}</button>`).join('');document.getElementById('browseContent').innerHTML=q?'<div class="search-empty">正在站内搜索…</div>':'<div class="search-empty">选择分类开始浏览</div>';if(q)try{const list=await searchSite(s,q);document.getElementById('browseContent').innerHTML=list.length?`<div class="result-list">${list.map(v=>`<div class="result"><img src="${esc(v.pic||'')}"><div><h3>${esc(v.title)}</h3><p>${esc(v.quality||s.name)}</p></div><button onclick='openItem(${JSON.stringify(v)})'>›</button></div>`).join('')}</div>`:'<div class="search-empty">没有结果</div>'}catch(e){document.getElementById('browseContent').innerHTML='<div class="search-empty">站源暂时不可用</div>'}}
function closeBrowse(){document.getElementById('browseModal').classList.remove('show')}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}
async function browseSiteCat(siteId,cat){const s=sites.find(x=>x.id===siteId);if(!s)return;document.getElementById('browseContent').innerHTML='<div class="search-empty">加载中…</div>';try{if(cat==='history'||cat==='fav'){const arr=cat==='fav'?readLS(LS_FAV,[]):readLS(LS_HISTORY,[]);const a=arr.filter(x=>!x.siteId||x.siteId===siteId);document.getElementById('browseContent').innerHTML=a.length?'<div class="grid">'+a.map(card).join('')+'</div>':'<div class="search-empty">暂无内容</div>';return}const path=s.categoryUrl?s.categoryUrl.replace('{categoryId}',cat).replace('{page}','1'):'/';const r=await getSite(s,path),d=doc(r.html),els=[...d.querySelectorAll(s.listSelector||'.module-item')];const list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,24);document.getElementById('browseContent').innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="search-empty">没有内容</div>'}catch(e){document.getElementById('browseContent').innerHTML='<div class="search-empty">加载失败，请稍后再试</div>'}}
async function panReq(path,body){return JSON.parse(await request(state.panApi.replace(/\/+$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),responseType:'text',timeout:15}))}
async function panSearch(q){const data=await panReq('/api/search',{kw:q,res:'merge',src:'all',cloud_types:state.panTypes});const by=(data&&data.data&&data.data.merged_by_type)||(data&&data.merged_by_type)||{};const out=[];Object.keys(by).forEach(type=>{(by[type]||[]).forEach(x=>{const url=x.url||x.share_url||'';if(!url||state.panTypes.indexOf(type)<0)return;out.push({type,title:clean(x.note||x.title||x.name||q),url,password:x.password||x.pwd||''})})});const seen=new Set();return out.filter(x=>{const k=x.type+'|'+x.url;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>qualityRank(b.title)-qualityRank(a.title))}
function qualityRank(t){const s=String(t||'').toLowerCase();let n=0;if(/dolby.?vision|dovi|杜比视界/.test(s))n+=100;if(/hdr10\+/.test(s))n+=90;else if(/hdr/.test(s))n+=80;if(/4k|2160p|uhd/.test(s))n+=70;if(/remux|原盘|bluray|蓝光/.test(s))n+=65;if(/h265|hevc|x265/.test(s))n+=55;if(/atmos|杜比全景声/.test(s))n+=50;if(/1080p/.test(s))n+=40;if(/60fps|60帧/.test(s))n+=30;return n}
function openPan(){document.getElementById('panModal').classList.add('show')}function closePan(){document.getElementById('panModal').classList.remove('show')}
async function doPanSearch(q){openPan();document.getElementById('panStatus').textContent='盘搜中：'+q;document.getElementById('panResults').innerHTML='<div class="search-empty">正在搜索网盘资源…</div>';try{const list=await panSearch(q);document.getElementById('panStatus').textContent=`盘搜 · ${list.length} 条`;document.getElementById('panResults').innerHTML=list.length?list.map(p=>`<div class="result"><div style="width:58px;height:82px;border-radius:10px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:20px">${esc(pansLabel(p))}</div><div><h3>${esc(p.title)}</h3><p>${esc(pansLabel(p))}${quality(p.title)?' · '+esc(quality(p.title)):''}</p></div><button onclick='playPan(${JSON.stringify(p)})'>▶</button></div>`).join(''):'<div class="search-empty">没有找到网盘资源</div>'}catch(e){document.getElementById('panResults').innerHTML='<div class="search-empty">盘搜失败，请检查盘搜接口。</div>'}}
async function playPan(p){if(currentDetail)pushHistory(currentDetail);const title=currentTitle||currentDetail?.title||p.title||'';const fm=await fmReady();try{if(fm&&fm.pan&&fm.pan.play){await fm.pan.play({type:p.type||'',url:p.url,password:p.password||'',title});return}if(fm&&fm.play){await fm.play(/^magnet:/i.test(p.url)?p.url:'push://'+p.url,title);return}}catch(e){}location.href=p.url}
function openSettings(){updateCounts();const body=document.getElementById('settingsBody');const panTypes=state.panTypes.map(x=>PAN_TYPE_LABEL[x]||x).join(' · ');const fmNow=!!window.fm;body.innerHTML=`<div class="quick-grid"><div class="quick"><b>${readLS(LS_FAV,[]).length}</b><span>收藏</span></div><div class="quick"><b>${readLS(LS_HISTORY,[]).length}</b><span>历史</span></div><div class="quick"><b>${sites.length}</b><span>资源站</span></div></div><div class="settings-list"><button class="settings-row" onclick="setAggregateMode()"><b>搜索模式</b><span>${aggregate?'聚合搜索':'单站搜索'}</span></button><button class="settings-row" onclick="configurePan()"><b>盘搜接口</b><span>${esc(state.panApi)}</span></button><button class="settings-row" onclick="showPanTypes()"><b>网盘类型</b><span>${esc(panTypes)}</span></button><button class="settings-row" onclick="showConnection()"><b>WebHome 连接</b><span>${fmNow?'原生桥接已检测':'等待壳子注入'}</span></button><button class="settings-row" onclick="openSiteDomainConfig()"><b>资源站域名</b><span>可覆盖当前站点域名</span></button></div>`;document.getElementById('settingsModal').classList.add('show')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('show')}
async function setAggregateMode(){aggregate=!aggregate;toast(aggregate?'已切换到聚合搜索':'已切换到单站搜索');openSettings()}
async function configurePan(){const v=prompt('盘搜接口地址',state.panApi);if(v!==null&&v.trim()){state.panApi=v.trim();localStorage.setItem('wo_pan_api',state.panApi);toast('盘搜接口已保存');openSettings()}}
async function showPanTypes(){const raw=prompt('网盘类型，用逗号分隔\n夸克,阿里,百度,UC,天翼,迅雷,123,115,移动,光鸭,磁力,电驴',state.panTypes.map(x=>PAN_TYPE_LABEL[x]||x).join(','));if(raw===null)return;const map={夸克:'quark',阿里:'aliyun',百度:'baidu',UC:'uc',天翼:'tianyi',迅雷:'xunlei',123:'123',115:'115',移动:'mobile',光鸭:'guangya',磁力:'magnet',电驴:'ed2k'};const arr=raw.split(/[,，]/).map(x=>map[x.trim()]||x.trim()).filter(x=>PAN_ALL_TYPES.includes(x));state.panTypes=arr.length?arr:PAN_ALL_TYPES.slice();localStorage.setItem('wo_pan_types',JSON.stringify(state.panTypes));toast('网盘类型已保存');openSettings()}
async function showConnection(){const fm=await fmReady();toast(fm?'WebHome 原生桥接已连接':'当前页面未检测到 window.fm，需在 WebHome 壳子中运行')}
async function openSiteDomainConfig(){const current=sites.find(x=>x.id===activeSiteId)||sites[0];const old=readLS(LS_DOMAINS,{}),val=prompt(`${current.name} · 域名设置\n每行一个域名\n留空恢复默认`,(Array.isArray(old[current.id])?old[current.id]:domainsFor(current)).join('\n'));if(val===null)return;const arr=val.split(/[\n,，;]+/).map(x=>x.trim()).filter(Boolean);if(arr.length){old[current.id]=arr.map(x=>/^https?:\/\//i.test(x)?x:'https://'+x)}else delete old[current.id];writeLS(LS_DOMAINS,old);toast('站点域名已保存');openSettings()}
function openMe(){openSettings()}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}
function setNav(btn,name){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function scrollToGrid(){document.getElementById('grid').scrollIntoView({behavior:'smooth',block:'start'})}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1800)}
render();
</script></body></html>
