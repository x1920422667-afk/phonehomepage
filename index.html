function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function pic(u){return u||''} function safe(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function card(v){return `<button class="card" onclick="openDetail('${safe(v.media)}','${safe(v.id)}')"><img class="poster" src="${pic(v.pic)}" onerror="this.onerror=null;this.src='${pic(v.pic).replace('https://images.tmdb.org','https://image.tmdb.org')}'" loading="lazy"><span class="badge">${v.score&&Number(v.score)>0?v.score:'NEW'}</span><div class="card-title">${esc(v.title)}</div><p class="card-meta">${v.media==='movie'?'电影':'剧集'}</p></button>`}
function render(){document.getElementById('rail1').innerHTML=items.slice(0,12).map(card).join('');document.getElementById('rail2').innerHTML=items.filter(v=>Number(v.score)>=8).slice(0,12).map(card).join('');document.getElementById('grid').innerHTML=items.map(card).join('');document.getElementById('countText').textContent=items.length+' 部';renderHero()}
function renderHero(){document.getElementById('hero').innerHTML=`<div class="hero-bg" style="background-image:url('${heroItem.pic.replace('/w342/','/w780/')}')"></div><div class="hero-content"><div class="eyebrow">CURATED FOR TONIGHT</div><h1>${esc(heroItem.title)}</h1><div class="hero-meta"><span>${heroItem.media==='movie'?'电影':'剧集'}</span><span>·</span><span class="score">★ ${heroItem.score||'—'}</span><span>·</span><span>TMDB</span></div><div class="hero-desc">来自你提供的推荐源。数据保持原样，呈现则重新设计成更沉浸、更安静的移动影院体验。</div><div class="hero-actions"><button class="primary" onclick="openDetail('${heroItem.media}','${heroItem.id}')">▶ 立即查看</button><button class="ghost" onclick="heroItem=items[Math.floor(Math.random()*items.length)];renderHero()">换一部</button></div></div>`}
async function openDetail(type,id){const base=items.find(v=>v.id==id&&v.media===type);if(base)pushHistory(base);document.getElementById('detailModal').classList.add('show');document.getElementById('detail').innerHTML='<div class="search-empty">正在加载影片资料…</div>';try{const r=await fetch(`${TMDB}/${type}/${id}?api_key=${TMDB_KEY}&language=zh-CN`);if(!r.ok)throw 0;const d=await r.json();const title=d.title||d.name||'';window.baseDetail={id:String(id),media:type,title,pic:d.poster_path?IMG342+d.poster_path:(items.find(v=>v.id==id)?.pic||''),score:String(d.vote_average||'')};const poster=d.poster_path?IMG342+d.poster_path:items.find(v=>v.id==id)?.pic||'';const back=d.backdrop_path?IMG+d.backdrop_path:poster;const genres=(d.genres||[]).slice(0,5).map(x=>`<span class="tag">${esc(x.name)}</span>`).join('');const year=(d.release_date||d.first_air_date||'').slice(0,4);document.getElementById('detail').innerHTML=`<div class="detail-bg" style="background-image:url('${back}')"></div><div class="detail-shade"></div><div class="detail-content"><div class="eyebrow">${type==='movie'?'FILM':'SERIES'}</div><h1 class="detail-title">${esc(title)}</h1><div class="detail-sub">${year||'—'} · ★ ${Number(d.vote_average||0).toFixed(1)} · ${d.vote_count||0} 人评分</div><img class="detail-poster" src="${poster}"><p class="detail-overview">${esc(d.overview||'暂无简介')}</p><div style="clear:both"></div><div class="tagrow">${genres}</div><div style="display:grid;grid-template-columns:1fr auto;gap:8px"><button class="primary" style="width:100%" onclick="openSources()">▶ 选择播放资源</button><button class="ghost" onclick="toggleFav(window.baseDetail)" style="padding:0 16px">♡</button></div><div style="margin-top:24px"><div class="section-head"><h2>站点资源</h2><p>${sites.length} 个源</p></div><div class="source-grid">${sites.slice(0,6).map(s=>`<button class="source" onclick="goSite('${s.id}','${encodeURIComponent(title)}')"><b>${esc(s.name)}</b><span>${s.cats.slice(0,4).map(c=>c[1]).join(' · ')}</span></button>`).join('')}</div></div></div>`}catch(e){document.getElementById('detail').innerHTML='<div class="search-empty">影片详情暂时无法获取，请检查网络连接。</div>'}}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}function openSearch(){document.getElementById('searchPanel').classList.add('show');setTimeout(()=>document.getElementById('searchInput').focus(),80)}function closeSearch(){document.getElementById('searchPanel').classList.remove('show');document.getElementById('searchResult').className='search-empty';document.getElementById('searchResult').innerHTML='输入片名开始搜索';document.getElementById('searchInput').value=''}
let timer;document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(()=>doSearch(q),240)});
async function doSearch(q){if(!q){document.getElementById('searchResult').className='search-empty';document.getElementById('searchResult').innerHTML='输入片名开始搜索';return}document.getElementById('searchResult').className='search-empty';document.getElementById('searchResult').innerHTML='搜索中…';try{const r=await fetch(`${TMDB}/search/multi?api_key=${TMDB_KEY}&language=zh-CN&query=${encodeURIComponent(q)}&include_adult=false`);const d=await r.json();const list=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,20);document.getElementById('searchResult').className=list.length?'result-list':'search-empty';document.getElementById('searchResult').innerHTML=list.length?list.map(x=>`<div class="result"><img src="${x.poster_path?IMG342+x.poster_path:''}"><div><h3>${esc(x.title||x.name||'未命名')}</h3><p>${(x.release_date||x.first_air_date||'').slice(0,4)} · ★ ${Number(x.vote_average||0).toFixed(1)}</p></div><button onclick="openDetail('${x.media_type}','${x.id}')">›</button></div>`).join(''):'没有找到相关内容'}catch(e){document.getElementById('searchResult').innerHTML='搜索失败，请检查网络。'}}
function scrollToGrid(){document.getElementById('grid').scrollIntoView({behavior:'smooth',block:'start'})}
function openSources(){document.getElementById('sources').innerHTML=sites.map(s=>`<button class="source" onclick="goSite('${s.id}','')"><b>${esc(s.name)}</b><span>${esc(s.domains[0]||'')}</span></button>`).join('');document.getElementById('sourceModal').classList.add('show')}function closeSources(){document.getElementById('sourceModal').classList.remove('show')}
function goSite(id,title){const s=sites.find(x=>x.id===id);if(!s)return;let url=s.domains[0]||'';if(title){if(id==='wanou'||url.includes('wogg'))url+='/vodsearch/-------------.html?wd='+title;else if(id==='4kzn')url+='/?post_type=book&s='+title;else url+='/';}window.open(url,'_blank')}

const LS_FAV='nova_fav_v1', LS_HISTORY='nova_history_v1';
function readLS(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function writeLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function isFav(v){return readLS(LS_FAV).some(x=>x.id===v.id&&x.media===v.media)}
function toggleFav(v){let a=readLS(LS_FAV);const i=a.findIndex(x=>x.id===v.id&&x.media===v.media);if(i>=0)a.splice(i,1);else a.unshift(v);writeLS(LS_FAV,a);updateCounts();toast(i>=0?'已取消收藏':'已加入收藏')}
function pushHistory(v){let a=readLS(LS_HISTORY);a=a.filter(x=>!(x.id===v.id&&x.media===v.media));a.unshift({...v,at:Date.now()});writeLS(LS_HISTORY,a.slice(0,50));updateCounts()}
function updateCounts(){const f=readLS(LS_FAV),h=readLS(LS_HISTORY);const fc=document.getElementById('favCount');const hc=document.getElementById('historyCount');if(fc)fc.textContent=f.length;if(hc)hc.textContent=h.length;const dot=document.getElementById('favDot');if(dot)dot.style.display=f.length?'block':'none';const last=h[0];const ct=document.getElementById('continueTitle');if(ct)ct.textContent=last?last.title:'还没有观看记录'}
function openLibrary(){renderLibrary('all');document.getElementById('libraryOverlay').classList.add('show')}
function renderLibrary(type,btn){const tabs=document.querySelectorAll('.library-tabs button');tabs.forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');let arr=type==='fav'?readLS(LS_FAV):type==='history'?readLS(LS_HISTORY):items;const box=document.getElementById('libraryGrid'),empty=document.getElementById('libraryEmpty');box.innerHTML=arr.map(card).join('');empty.style.display=arr.length?'none':'block'}
function openMe(){updateCounts();document.getElementById('meOverlay').classList.add('show')}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}
function setNav(btn){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}

render();updateCounts();
</script></body></html>
